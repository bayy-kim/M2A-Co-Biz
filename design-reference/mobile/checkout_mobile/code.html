<div>

</div>

<div class="space-y-sm">
<!-- Selectable Card 1 -->
<label class="relative block cursor-pointer group">
<input checked="" class="peer sr-only" name="payment" type="radio"/>
<div class="bg-surface-container-lowest border border-outline-variant p-lg rounded-xl flex items-center gap-lg transition-all peer-checked:ring-2 peer-checked:ring-primary-container peer-checked:bg-primary/5 hover:bg-surface-container-low">
<div class="w-10 h-10 flex items-center justify-center bg-primary/10 rounded-lg text-primary">

<div class="flex-1">
<p class="font-bold text-on-surface font-body-lg">Bank Transfer (VA)</p>

</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full flex items-center justify-center peer-checked:border-primary">
<div class="w-3 h-3 bg-primary rounded-full opacity-0 peer-checked:opacity-100 transition-opacity"></div>
</div>
</div>
</label>
<!-- Selectable Card 2 -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="payment" type="radio"/>
<div class="bg-surface-container-lowest border border-outline-variant p-lg rounded-xl flex items-center gap-lg transition-all peer-checked:ring-2 peer-checked:ring-primary-container peer-checked:bg-primary/5 hover:bg-surface-container-low">

<p class="font-bold text-on-surface font-body-lg">E-Wallet</p>

</div>
<div class="w-6 h-6 border-2 border-outline-variant rounded-full flex items-center justify-center peer-checked:border-primary">
<div class="w-3 h-3 bg-primary rounded-full opacity-0 transition-opacity"></div>
</div>
</div>
</label>
<!-- Selectable Card 3 -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="payment" type="radio"/>
<div class="bg-surface-container-lowest border border-outline-variant p-lg rounded-xl flex items-center gap-lg transition-all peer-checked:ring-2 peer-checked:ring-primary-container peer-checked:bg-primary/5 hover:bg-surface-container-low">

</div>

</main>
<!-- Sticky Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-md border-t border-outline-variant/30 px-margin py-lg z-50 flex flex-col gap-sm shadow-[0_-4px_10px_rgba(0,0,0,0.05)]">
<div class="flex justify-between items-center mb-sm">
<span class="text-on-surface-variant text-label-md">Total Pembayaran</span>
<span class="text-primary font-bold text-headline-md">Rp 352.500</span>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-bold py-md rounded-xl text-body-lg shadow-lg hover:brightness-110 active:scale-[0.97] transition-all flex items-center justify-center gap-md" id="payButton">
            Selesaikan Pembayaran
            <span class="material-symbols-outlined text-body-lg">arrow_forward</span>
</button>
</footer>
<script>
        // Micro-interactions for payment radio buttons
        document.querySelectorAll('input[name="payment"]').forEach(input => {
            input.addEventListener('change', (e) => {
                // Find the radio visual indicator
                document.querySelectorAll('input[name="payment"]').forEach(other => {
                    const circle = other.closest('label').querySelector('.w-3.h-3');
                    if (other.checked) {
                        circle.classList.add('opacity-100');
                        circle.classList.remove('opacity-0');
                    } else {
                        circle.classList.remove('opacity-100');
                        circle.classList.add('opacity-0');
                    }
                });
            });
        });

        // Simple button tap effect
        const payBtn = document.getElementById('payButton');
        payBtn.addEventListener('click', () => {
            payBtn.innerHTML = `
                <div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                Processing...
            `;
            setTimeout(() => {
                payBtn.innerHTML = 'Payment Successful!';
                payBtn.classList.replace('bg-primary-container', 'bg-success');
                payBtn.classList.replace('text-on-primary-container', 'text-white');
            }, 1500);
        });
    </script>
