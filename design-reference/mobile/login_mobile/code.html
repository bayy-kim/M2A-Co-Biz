<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center overflow-x-hidden p-margin">
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 opacity-30">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary-container/20 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] rounded-full bg-accent-gold/10 blur-[120px]"></div>
</div>
<!-- Login Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-3xl p-8 shadow-sm border border-surface-container-high relative overflow-hidden">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-4 shadow-lg shadow-primary-container/20">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="business_center">business_center</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">M2A Co-Biz</h1>
<p class="text-on-surface-variant text-body-md mt-2">Welcome back to the community</p>
</div>
<!-- Form Canvas -->
<form class="space-y-6" id="loginForm">
<!-- Credentials Section -->
<div class="space-y-4 transition-all duration-300" id="credentialsStep">
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 font-body-md focus:border-primary transition-all" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-[20px] group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 font-body-md focus:border-primary transition-all" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end">
<a class="text-label-sm font-label-sm text-primary hover:underline" href="#">Forgot password?</a>
</div>
</div>
</div>
<!-- 2FA Section (Hidden by default) -->
<div class="hidden space-y-6 transition-all duration-500 opacity-0 transform translate-y-4" id="otpStep">
<div class="text-center">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Secure Verification</h2>
<p class="text-on-surface-variant text-body-md">We've sent a 6-digit code to your email.</p>
</div>
<div class="flex justify-between gap-2 px-1">
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-outline-variant rounded-xl focus:border-accent-gold focus:ring-0 transition-all" maxlength="1" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-outline-variant rounded-xl focus:border-accent-gold focus:ring-0 transition-all" maxlength="1" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-outline-variant rounded-xl focus:border-accent-gold focus:ring-0 transition-all" maxlength="1" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-outline-variant rounded-xl focus:border-accent-gold focus:ring-0 transition-all" maxlength="1" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-outline-variant rounded-xl focus:border-accent-gold focus:ring-0 transition-all" maxlength="1" type="number"/>
<input class="otp-input w-12 h-14 md:w-14 md:h-16 text-center text-headline-lg font-headline-lg bg-surface-container-low border-2 border-outline-variant rounded-xl focus:border-accent-gold focus:ring-0 transition-all" maxlength="1" type="number"/>
</div>
<p class="text-center text-label-md text-on-surface-variant">
                    Didn't receive code? <button class="text-primary font-bold hover:underline" type="button">Resend</button>
</p>
</div>
<!-- Action Button -->
<button class="w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-4 rounded-2xl shadow-lg shadow-primary-container/25 hover:brightness-110 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 group" id="mainButton" type="button">
<span id="buttonText">Continue</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward" id="buttonIcon">arrow_forward</span>
</button>
</form>
<!-- Footer Help -->
<div class="mt-8 text-center border-t border-surface-container-high pt-6">
<p class="text-label-md font-label-md text-on-surface-variant">
                Need a business account? <a class="text-accent-gold font-bold hover:underline" href="#">Join the Co-Biz</a>
</p>
</div>
</div>
<!-- Background Elements (Abstract) -->
<div class="mt-12 text-center opacity-40">
<p class="text-label-sm font-label-sm uppercase tracking-widest text-outline">Professional • Warm • Trustworthy</p>
</div>
<script>
        const mainButton = document.getElementById('mainButton');
        const buttonText = document.getElementById('buttonText');
        const buttonIcon = document.getElementById('buttonIcon');
        const credentialsStep = document.getElementById('credentialsStep');
        const otpStep = document.getElementById('otpStep');
        const otpInputs = document.querySelectorAll('.otp-input');

        let currentStep = 'credentials';

        mainButton.addEventListener('click', () => {
            if (currentStep === 'credentials') {
                // Animate transition to OTP
                credentialsStep.classList.add('opacity-0', '-translate-y-4');
                setTimeout(() => {
                    credentialsStep.classList.add('hidden');
                    otpStep.classList.remove('hidden');
                    // Force reflow
                    otpStep.offsetHeight;
                    otpStep.classList.remove('opacity-0', 'translate-y-4');
                    
                    buttonText.innerText = 'Verify & Login';
                    mainButton.classList.remove('bg-primary-container');
                    mainButton.classList.add('bg-accent-gold');
                    mainButton.classList.remove('shadow-primary-container/25');
                    mainButton.classList.add('shadow-accent-gold/25');
                    
                    currentStep = 'otp';
                    otpInputs[0].focus();
                }, 300);
            } else {
                // Handle Login Success
                mainButton.disabled = true;
                buttonText.innerText = 'Signing in...';
                buttonIcon.innerText = 'sync';
                buttonIcon.classList.add('animate-spin');
                
                setTimeout(() => {
                    alert('Successfully logged in to M2A Co-Biz!');
                    window.location.reload();
                }, 1500);
            }
        });

        // OTP Input Logic
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });
    </script>
</body></html>
